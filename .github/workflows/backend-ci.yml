name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/home_store
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough
      HOUSEHOLD_PASSPHRASE: ci-passphrase
      ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --import tsx src/persistence/migrate-cli.ts
      - run: npm run build
      - run: npm run lint
      - run: npm run format
      - run: npm test

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      HOUSEHOLD_PASSPHRASE_HASH: ${{ secrets.HOUSEHOLD_PASSPHRASE_HASH }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
      ALLOWED_ORIGINS: ${{ secrets.FRONTEND_ORIGIN }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          node -e '
            const response = JSON.parse(process.argv[1]);
            const payload = JSON.parse(
              Buffer.from(response.value.split(".")[1], "base64url").toString(),
            );
            console.log(JSON.stringify({
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              ref: payload.ref,
              event_name: payload.event_name,
              environment: payload.environment,
            }, null, 2));
          ' "$token_response"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - run: npm ci
      - run: node --import tsx src/persistence/migrate-cli.ts
      - run: npm run build
      - run: npx serverless deploy --stage production --region ap-south-1 --conceal
