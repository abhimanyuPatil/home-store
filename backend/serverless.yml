org: bizecho
app: home-store
service: home-store-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  httpApi:
    cors:
      allowedOrigins:
        - ${env:FRONTEND_ORIGIN, 'http://localhost:5173'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS

  environment:
    NODE_ENV: production
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    HOUSEHOLD_PASSPHRASE_HASH: ${env:HOUSEHOLD_PASSPHRASE_HASH}
    ALLOWED_ORIGINS: ${env:FRONTEND_ORIGIN}

plugins:
  - serverless-offline

functions:
  api:
    handler: dist/src/handler.handler
    events:
      - httpApi: '*'

package:
  patterns:
    - dist/**
    - migrations/**
    - '!tests/**'
    - '!src/**'
    - '!coverage/**'
