name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/home_store
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough
      HOUSEHOLD_PASSPHRASE: ci-passphrase
      ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm run build
      - run: npm run lint
      - run: npm run format
      - run: npm test
